<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A social flight diary for logging flights, writing reviews, and browsing other travellers' entries.">
    <title>{% block title %}Flightbook{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header page-width">
      <a class="wordmark" href="{{ url_for('index') }}" aria-label="Flightbook home">Flightbook<span aria-hidden="true">.</span></a>
      <nav class="account-nav" aria-label="Account">
        {% if g.user %}
        <a href="{{ url_for('my_flights') }}">My flights</a>
        <span class="account-name">{{ g.user.username }}</span>
        <form action="{{ url_for('logout') }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
          <button class="link-button" type="submit">Log out</button>
        </form>
        {% else %}
        <a href="{{ url_for('login') }}">Log in</a>
        <a href="{{ url_for('register') }}">Create account</a>
        {% endif %}
      </nav>
    </header>
    <main id="main-content" class="page-width" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
