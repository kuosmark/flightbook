<button type="submit" name="action" value="continue" hidden>Continue</button>
<div class="form-grid">
  {% for key, label in [('departure_code', 'From'), ('arrival_code', 'To')] %}
    {{ airport_field(
      key, label, values[key], errors.get(key),
      required=true, picked_name=picked.get(key), focus=request.form.get('find') == key
    ) }}
  {% endfor %}
</div>
<div class="form-field">
  <label for="departure_date">Departure date</label>
  <input id="departure_date" name="departure_date" type="date"
         value="{{ values.departure_date }}" max="{{ today }}" required
         {{ invalid('departure_date') }}>
  {{ feedback('departure_date') }}
</div>
<div class="form-actions">
  <button class="button" name="action" value="continue">Continue</button>
  <a href="{{ url_for('my_flights') }}">Cancel</a>
</div>
