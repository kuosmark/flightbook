{% extends "base.html" %}

{% block title %}Explore flights · Flightbook{% endblock %}

{% block content %}
<section class="introduction" aria-labelledby="intro-heading">
  <h1 id="intro-heading">Your flight diary</h1>
  <p class="intro-copy">Keep a record of your flights and share your experiences.</p>
</section>

<section class="flight-section" aria-labelledby="flights-heading">
  <div class="section-heading">
    <h2 id="flights-heading">Explore flights</h2>
  </div>
  <div class="empty-state">
    <span class="route-mark" aria-hidden="true">○ ─ ─ ─ ○</span>
    <h3>No flights yet</h3>
    <p>Flight logging isn't available yet.</p>
  </div>
</section>
{% endblock %}
